---
name: E2E Tests

on:
  workflow_dispatch:
  pull_request_target:

permissions: {}

jobs:

  set-pending:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    name: Set pending e2e status
    permissions:
      statuses: write  # for gh api to set the commit status
    steps:
      - name: Set pending e2e status
        run: |
          gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state="pending" \
            -f context="e2e" \
            -f description="E2E tests must be triggered manually via workflow_dispatch"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read  # for actions/checkout to fetch code
    timeout-minutes: ${{ matrix.timeout || 5 }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora 43
            test: TestFedora
            release: "43"
          - name: CentOS Stream 10
            test: TestCentOSStream
            release: "10"
          - name: AlmaLinux 10
            test: TestAlmaLinux
            release: "10"
          - name: Rocky Linux 10
            test: TestRockyLinux
            release: "10"
          - name: Debian trixie
            test: TestDebian
            release: trixie
          - name: Ubuntu noble
            test: TestUbuntu
            release: noble
          - name: Arch Linux latest
            test: TestArch
            release: latest
          - name: Gentoo latest
            test: TestGentoo
            release: latest
            timeout: 10

    name: ${{ matrix.name }}

    steps:

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 'stable'
          check-latest: true

      - name: Run e2e test
        env:
          E2E_RELEASE: ${{ matrix.release }}
          CONTAINER_RUNTIME: docker
        run: go test -tags e2e -v -race -timeout ${{ matrix.timeout || 5 }}m -run ${{ matrix.test }} ./test/e2e/

  report-status:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [e2e]
    runs-on: ubuntu-latest
    name: Report e2e status
    permissions:
      statuses: write  # for gh api to set the commit status
    steps:
      - name: Report e2e status
        run: |
          case "${{ needs.e2e.result }}" in
            success)
              state="success"
              description="All E2E tests passed"
              ;;
            cancelled)
              state="error"
              description="E2E tests were cancelled"
              ;;
            skipped)
              state="error"
              description="E2E tests were skipped"
              ;;
            *)
              state="failure"
              description="E2E tests failed"
              ;;
          esac
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" \
            -f context="e2e" \
            -f description="$description"
        env:
          GH_TOKEN: ${{ github.token }}
